name: Election Unit Tests
on:
  push:
    branches:
      - vnv/election-unit-testing
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: postgresql://test:test@localhost:5432/election_test
      JWT_SECRET: unit-test-only-secret-not-for-production
      JWT_EXPIRES_IN: 1h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test
      - name: Measure scoped unit test coverage
        run: npm run test:coverage
        env:
          NODE_V8_COVERAGE: coverage/v8
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: coverage/v8/
          if-no-files-found: warn
