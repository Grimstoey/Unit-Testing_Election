name: Election Unit Tests
on:
  push:
    branches:
      - vnv/election-unit-testing
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: postgresql://test:test@localhost:5432/election_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test
